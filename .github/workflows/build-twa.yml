name: Build Android App (TWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Install Bubblewrap
      run: npm install -g @bubblewrap/cli

    - name: Generate Keystore (if not exists)
      run: |
        if [ ! -f android.keystore ]; then
          echo "Generating new keystore..."
          keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Marcenaria Pro, OU=Engineering, O=MarcPro, L=Sao Paulo, S=SP, C=BR"
        else
          echo "Using existing keystore."
        fi

    - name: Print SHA-256 Fingerprint
      run: |
        echo "=================================================================="
        echo "SHA-256 Fingerprint for Google Play Console:"
        keytool -list -v -keystore android.keystore -alias android -storepass password | grep "SHA256:"
        echo "=================================================================="

    - name: Configure Bubblewrap (Non-interactive)
      run: |
        mkdir -p $HOME/.bubblewrap
        echo "{\"jdkPath\": \"${JAVA_HOME}\", \"androidSdkPath\": \"${ANDROID_HOME}\"}" > $HOME/.bubblewrap/config.json
        cat $HOME/.bubblewrap/config.json

    - name: Build TWA
      run: |
        (echo "y"; echo "1.0.0"; echo "6") | bubblewrap build --manifest twa-manifest.json --skipPwaValidation

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-bundle
        path: ./*.aab

    - name: Upload Keystore (SAVE THIS!)
      uses: actions/upload-artifact@v4
      with:
        name: signing-keystore
        path: android.keystore
