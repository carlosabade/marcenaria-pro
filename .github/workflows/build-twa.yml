name: Build Android App (TWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Install Bubblewrap
      run: npm install -g @bubblewrap/cli

    - name: Generate Keystore (if not exists)
      run: |
        if [ ! -f android.keystore ]; then
          echo "Generating new keystore..."
          keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Marcenaria Pro, OU=Engineering, O=MarcPro, L=Sao Paulo, S=SP, C=BR"
        else
          echo "Using existing keystore."
        fi

    - name: Print SHA-256 Fingerprint
      run: |
        echo "=================================================================="
        echo "SHA-256 Fingerprint for Google Play Console:"
        keytool -list -v -keystore android.keystore -alias android -storepass password | grep "SHA256:"
        echo "=================================================================="

    - name: Configure Bubblewrap (Non-interactive)
      run: |
        mkdir -p $HOME/.bubblewrap
        echo "{\"jdkPath\": \"${JAVA_HOME}\", \"androidSdkPath\": \"${ANDROID_HOME}\"}" > $HOME/.bubblewrap/config.json
        cat $HOME/.bubblewrap/config.json

    - name: Install Expect
      run: sudo apt-get install -y expect

    - name: Build TWA with Expect
      run: |
        cat <<EOF > build.exp
        #!/usr/bin/expect -f
        set timeout -1
        spawn bubblewrap build --manifest twa-manifest.json --skipPwaValidation
        expect {
          "regenerate" { send "y\r"; exp_continue }
          "Create" { send "y\r"; exp_continue }
          "versionName" { send "1.0.0\r"; exp_continue }
          "versionCode" { send "18\r"; exp_continue }
          -re "(?i).*notification.*" { send "n\r"; exp_continue }
          "Password" { send "password\r"; exp_continue }
          eof
        }
        EOF
        chmod +x build.exp
        ./build.exp

    - name: Fix Bubblewrap Generation Bug
      run: |
        sed -i 's/enableNotifications: ,/enableNotifications: false,/g' app/build.gradle || true
        sed -i 's/splashScreenFadeOutDuration: ,/splashScreenFadeOutDuration: 300,/g' app/build.gradle || true
        echo "=== BUILD.GRADLE CONTENT ==="
        cat app/build.gradle
        echo "============================"

    - name: Force Build and Locate AAB
      run: |
        cp android.keystore app/android.keystore || true
        chmod +x gradlew
        ./gradlew bundleRelease
        find app/build/outputs/bundle/release -name "*.aab" -exec cp {} app-release-bundle.aab \;

    - name: List Files (Debug)
      run: find . -maxdepth 4 -not -path '*/.*'

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-bundle
        path: app-release-bundle.aab

    - name: Upload Keystore (SAVE THIS!)
      uses: actions/upload-artifact@v4
      with:
        name: signing-keystore
        path: android.keystore
